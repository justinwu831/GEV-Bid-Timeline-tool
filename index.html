<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GE Vernova Aero Services — ITO Policy 5.0 Bid Timeline Management Tool</title>
  <style>
    /* ============================================
       GE VERNOVA DESIGN SYSTEM — COMPLETE CSS
       ============================================ */

    /* Font: Sons Condensed Extrabold → Inter → Segoe UI → Arial (heading fallback chain) */
    :root {
      /* Primary palette */
      --color-dk1:      #005E60;   /* Evergreen */
      --color-lt1:      #FFFFFF;   /* Day */
      --color-dk2:      #212121;   /* Night */
      --color-lt2:      #C8FF08;   /* Urgency Green */

      /* Evergreen tints */
      --color-accent1:  #004745;   /* Dark Evergreen */
      --color-accent6:  #458A8A;   /* Evergreen Tint 1 */
      --color-tint-2:   #96BDBD;   /* Evergreen Tint 2 */
      --color-tint-3:   #C7DBDB;   /* Evergreen Tint 3 */

      /* Grays */
      --color-gray-1:   #FAFAFA;   /* Gray 1 */
      --color-accent2:  #E3E3E3;   /* Gray 2 */
      --color-accent3:  #CCCCCC;   /* Gray 3 */
      --color-accent4:  #696969;   /* Gray 4 */
      --color-accent5:  #484848;   /* Gray 5 */

      /* Tertiary (charts only) */
      --color-hlink:      #2176FF; /* Dark Sky */
      --color-sky:        #5FB7FF; /* Sky */
      --color-fol-hlink:  #3E9E00; /* Dark Forest */
      --color-forest:     #7BDD3C; /* Forest */
      --color-dark-earth: #4A2419; /* Dark Earth */
      --color-earth:      #774936; /* Earth */

      /* Typography */
      --font-heading: "Sons Condensed Extrabold", "Inter", "Segoe UI", sans-serif;
      --font-body:    "Inter", "Segoe UI", sans-serif;

      /* Application-specific overrides */
      --gev-navy:     #005E60;
      --gev-teal:     #005E60;
      --gev-blue:     #00A3E0;
      --gev-lime:     #C8FF08;
      --gev-dark:     #212121;
      --gev-light:    #FAFAFA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: var(--font-body);
      background-color: var(--color-lt1);
      color: var(--color-dk2);
      line-height: 1.6;
    }

    /* ============================================
       HEADER
       ============================================ */

    .header {
      background-color: #005E60;
      color: var(--color-lt1);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--color-lt1);
      position: relative;
      padding-bottom: 4px;
    }

    .header-logo::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--gev-lime);
      border-radius: 2px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      text-transform: uppercase;
      font-family: var(--font-heading);
    }

    .header-title p {
      font-size: 12px;
      opacity: 0.9;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      gap: 12px;
    }

    .btn-reset {
      background-color: #ef4444;
      color: var(--color-lt1);
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-reset:hover {
      background-color: #dc2626;
    }

    /* ============================================
       DEAL SWITCHER BAR
       ============================================ */

    .deal-switcher {
      background-color: var(--color-gray-1);
      padding: 12px 32px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--color-accent2);
      overflow-x: auto;
      flex-wrap: wrap;
    }

    .deal-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .deal-pill:hover {
      border-color: #005E60;
    }

    .deal-pill.active {
      background-color: #005E60;
      color: var(--color-lt1);
      border-color: #005E60;
    }

    .deal-pill-name {
      cursor: text;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deal-pill-delete {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .deal-pill-delete:hover {
      opacity: 1;
    }

    .deal-pill-rename {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      opacity: 0.65;
      transition: opacity 0.2s;
      line-height: 1;
    }

    .deal-pill-rename:hover {
      opacity: 1;
    }

    .deal-pill-add {
      background-color: var(--gev-lime);
      color: #212121;
      border: 1px solid var(--gev-lime);
      font-weight: 600;
    }

    .deal-pill-add:hover {
      background-color: #b8e600;
      border-color: #b8e600;
    }

    .deal-pill-add:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ============================================
       MASTER VIEW BAR (above deal switcher)
       ============================================ */

    .master-view-bar {
      background-color: #004745;
      padding: 10px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid var(--gev-lime);
    }

    .master-view-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background-color: transparent;
      border: 2px solid rgba(200, 255, 8, 0.5);
      border-radius: 20px;
      color: var(--color-lt1);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .master-view-btn:hover {
      background-color: rgba(200, 255, 8, 0.15);
      border-color: var(--gev-lime);
    }

    .master-view-btn.active {
      background-color: var(--gev-lime);
      color: var(--gev-dark);
      border-color: var(--gev-lime);
    }

    .master-view-label {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ============================================
       TAB NAVIGATION
       ============================================ */

    .tab-nav {
      display: flex;
      gap: 0;
      background-color: var(--color-lt1);
      border-bottom: 2px solid var(--color-accent2);
      padding: 0 32px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent4);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }

    .tab-btn:hover {
      color: #005E60;
    }

    .tab-btn.active {
      color: #005E60;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #005E60;
    }

    /* ============================================
       TAB CONTENT
       ============================================ */

    .tab-content {
      display: none;
      padding: 24px 32px;
      animation: fadeIn 0.2s ease-in;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ============================================
       BID SETUP TAB — LAYOUT
       ============================================ */

    .bid-setup-container {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
    }

    .bid-setup-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .bid-setup-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ============================================
       FORM SECTIONS
       ============================================ */

    .form-section {
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .form-section-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: #005E60;
      border-left: 4px solid #005E60;
      padding-left: 12px;
      margin: 0;
      text-transform: uppercase;
      font-family: var(--font-heading);
    }

    .form-section-toggle {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #005E60;
    }

    .form-section.collapsed .form-section-content {
      display: none;
    }

    .form-section-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-dk2);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 12px;
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font-body);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #005E60;
      box-shadow: 0 0 0 3px rgba(0, 94, 96, 0.1);
    }

    .form-group-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    /* ============================================
       RADIO TOGGLES
       ============================================ */

    .radio-group {
      display: flex;
      gap: 12px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      cursor: pointer;
      accent-color: #005E60;
    }

    .radio-option label {
      cursor: pointer;
      font-size: 13px;
      margin: 0;
    }

    /* ============================================
       SCOPE SELECTION GRID
       ============================================ */

    .scope-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .scope-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .scope-checkbox:hover {
      border-color: #005E60;
      background-color: #f0fffe;
    }

    .scope-checkbox input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
      accent-color: #005E60;
    }

    .scope-checkbox-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }

    .scope-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-dk2);
    }

    .scope-meta {
      font-size: 11px;
      color: var(--color-accent4);
    }

    .scope-badge {
      display: inline-block;
      background-color: #005E60;
      color: var(--color-lt1);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      margin-top: 2px;
      width: fit-content;
    }

    /* ============================================
       SCOPE SUMMARY PANEL
       ============================================ */

    .scope-summary {
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
    }

    .scope-summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scope-summary-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-accent4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scope-summary-value {
      font-size: 14px;
      font-weight: 700;
      color: #005E60;
    }

    .scope-summary-note {
      grid-column: 1 / -1;
      font-size: 11px;
      color: var(--color-accent4);
      font-style: italic;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--color-accent3);
    }

    /* ============================================
       ALERT BADGES
       ============================================ */

    .alert-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
    }

    .alert-badge.green {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
      color: #166534;
    }

    .alert-badge.yellow {
      background-color: #fffbeb;
      border-left: 4px solid #f59e0b;
      color: #92400e;
    }

    .alert-badge.red {
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
    }

    .alert-badge.blue {
      background-color: #eff6ff;
      border-left: 4px solid #3b82f6;
      color: #1e40af;
    }

    .alert-badge-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .alert-badge-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .alert-badge-title {
      font-weight: 700;
    }

    .alert-badge-detail {
      font-size: 12px;
      opacity: 0.9;
    }

    /* ============================================
       ITO WORKFLOW STEPPER
       ============================================ */

    .ito-stepper {
      background-color: #f8f9fa;
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ito-stepper-title {
      font-size: 13px;
      font-weight: 700;
      color: #005E60;
      border-left: 4px solid var(--gev-teal);
      padding-left: 12px;
      margin: 0;
      text-transform: uppercase;
      font-family: var(--font-heading);
    }

    .ito-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ito-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }

    .ito-step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--color-accent2);
      border: 2px solid var(--color-accent3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-accent4);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .ito-step.active .ito-step-circle {
      background-color: #005E60;
      border-color: #005E60;
      color: var(--color-lt1);
    }

    .ito-step.dimmed .ito-step-circle {
      opacity: 0.4;
    }

    .ito-step-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 4px;
    }

    .ito-step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-dk2);
    }

    .ito-step.dimmed .ito-step-label {
      opacity: 0.5;
    }

    .ito-step-desc {
      font-size: 11px;
      color: var(--color-accent4);
    }

    .ito-step.dimmed .ito-step-desc {
      opacity: 0.5;
    }

    /* ============================================
       BUTTONS
       ============================================ */

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-primary {
      background-color: #005E60;
      color: var(--color-lt1);
    }

    .btn-primary:hover {
      background-color: #004745;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: var(--color-accent2);
      color: var(--color-dk2);
    }

    .btn-secondary:hover {
      background-color: var(--color-accent3);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }

    .btn-full-width {
      width: 100%;
    }

    /* ============================================
       GANTT CHART TAB
       ============================================ */

    .gantt-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .kpi-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .kpi-card {
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-accent4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-heading);
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      color: #212121;
    }

    .kpi-detail {
      font-size: 12px;
      color: #484848;
    }

    /* ============================================
       OVERDUE BANNER
       ============================================ */

    .overdue-banner {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid #ef4444;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #991b1b;
      font-weight: 500;
    }

    .overdue-banner-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .overdue-banner.hidden {
      display: none;
    }

    /* ============================================
       FILTER PILLS
       ============================================ */

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 8px 14px;
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-pill:hover {
      border-color: #005E60;
    }

    .filter-pill.active {
      background-color: #005E60;
      color: var(--color-lt1);
      border-color: #005E60;
    }

    /* ============================================
       GANTT TABLE
       ============================================ */

    .gantt-table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      overflow: hidden;
    }

    .gantt-table thead {
      background-color: #005E60;
      color: var(--color-lt1);
    }

    .gantt-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-heading);
    }

    .gantt-table td {
      padding: 12px 16px;
      border-top: 1px solid var(--color-accent2);
      font-size: 13px;
    }

    .gantt-table tbody tr {
      transition: background-color 0.2s;
    }

    .gantt-table tbody tr:hover {
      background-color: var(--color-gray-1);
    }

    .gantt-table tbody tr.phase-header {
      background-color: #005E60;
      color: var(--color-lt1);
      font-weight: 700;
    }

    .gantt-table tbody tr.phase-header:hover {
      background-color: #005E60;
    }

    .gantt-table tbody tr.overdue {
      background-color: #fff5f5;
      border-left: 4px solid #ef4444;
    }

    .gantt-table tbody tr.critical {
      font-weight: 700;
      border-left: 4px solid #f59e0b;
    }

    .gantt-table tbody tr.gate {
      background-color: #fef3c7;
      font-weight: 600;
    }

    .gantt-table tbody tr.complete {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
    }

    .gantt-table tbody tr.complete .task-name {
      text-decoration: line-through;
      color: #166534;
    }

    .task-name {
      font-weight: 500;
      color: var(--color-dk2);
    }

    .task-name.gate {
      font-weight: 700;
      color: #b45309;
    }

    .task-owner {
      font-size: 12px;
      color: var(--color-accent4);
    }

    .task-due {
      font-size: 12px;
      color: var(--color-dk2);
    }

    .task-status-select {
      padding: 6px 8px;
      border: 1px solid var(--color-accent2);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      background-color: var(--color-lt1);
    }

    .task-status-select:focus {

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">GEV</div>
      <div class="header-title">
        <h1>Aero Services · ITO Policy 5.0 — Bid Timeline Manager</h1>

      </div>
    </div>
    <div class="header-right">
      <button class="btn-reset" onclick="confirmReset()">🔄 Reset All</button>
    </div>
  </header>

  <!-- MASTER VIEW BAR (above deal switcher) -->
  <div class="master-view-bar">
    <span class="master-view-label">Portfolio:</span>
    <button class="master-view-btn" id="masterViewBarBtn" onclick="switchToMasterView()">📊 Master View</button>
  </div>

  <!-- DEAL SWITCHER BAR -->
  <div class="deal-switcher" id="dealSwitcher"></div>

  <!-- TAB NAVIGATION -->
  <div class="tab-nav" id="tabNav"></div>

  <!-- TAB CONTENT -->
  <div id="bidSetupTab" class="tab-content active"></div>
  <div id="ganttTab" class="tab-content"></div>
  <div id="execSummaryTab" class="tab-content"></div>
  <div id="masterViewTab" class="tab-content"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">Confirm</h2>
      <p class="modal-content" id="modalContent"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // SCOPE CONFIGURATION
    // ============================================

    const SCOPE_CONFIG = {
      'Repair':         { days: 5, hasSME: true,  criticalPath: false },
      'Field Services': { days: 5, hasSME: true,  criticalPath: false },
      'Fulfillment':    { days: 7, hasSME: true,  criticalPath: false },
      'Legal':          { days: 6, hasSME: false, criticalPath: false },
      'Finance':        { days: 4, hasSME: false, criticalPath: false },
      'Insurance':      { days: 4, hasSME: false, criticalPath: false },
      'Treasury':       { days: 5, hasSME: false, criticalPath: false },
      'Pricing':        { days: 4, hasSME: true,  criticalPath: false },
      'Logistics':      { days: 4, hasSME: false, criticalPath: false }
    };

    let currentGanttFilter = 'all';
    let currentActiveTab = 'bidSetup';

    // ============================================
    // WORKING DAY UTILITIES
    // ============================================

    function isWorkingDay(date) {
      const day = date.getDay();
      return day !== 0 && day !== 6; // Not Sunday or Saturday
    }

    function addWorkingDays(date, days) {
      const result = new Date(date);
      let count = 0;
      while (count < days) {
        result.setDate(result.getDate() + 1);
        if (isWorkingDay(result)) count++;
      }
      return result;
    }

    function subtractWorkingDays(date, days) {
      const result = new Date(date);
      let count = 0;
      while (count < days) {
        result.setDate(result.getDate() - 1);
        if (isWorkingDay(result)) count++;
      }
      return result;
    }

    function countWorkingDays(start, end) {
      let count = 0;
      const current = new Date(start);
      while (current <= end) {
        if (isWorkingDay(current)) count++;
        current.setDate(current.getDate() + 1);
      }
      return count;
    }

    function formatDate(date) {
      if (!date) return '';
      const d = new Date(date);
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const year = d.getFullYear();
      return `${month}/${day}/${year}`;
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      const [month, day, year] = dateStr.split('/');
      return new Date(year, month - 1, day);
    }

    // ============================================
    // STATE MANAGEMENT
    // ============================================

    let appState = {
      deals: [],
      activeDealId: null
    };

    function initializeState() {
      const saved = localStorage.getItem('gevITO_v2');
      if (saved) {
        try {
          appState = JSON.parse(saved);
        } catch (e) {
          appState = { deals: [], activeDealId: null };
        }
      }
      if (appState.deals.length === 0) {
        createNewDeal();
      }
      if (!appState.activeDealId) {
        appState.activeDealId = appState.deals[0].id;
      }
    }

    function saveState() {
      localStorage.setItem('gevITO_v2', JSON.stringify(appState));
    }

    function createNewDeal() {
      if (appState.deals.length >= 8) return;
      const id = 'deal_' + Date.now();
      const deal = {
        id,
        name: `Deal ${appState.deals.length + 1}`,
        opportunityName: '',
        opportunityType: 'Service',
        bidValue: 'Under $500K',
        cmName: '',
        smName: '',
        cslName: '',
        dealComplexity: 'Medium — 10 Working Days',
        dealPriority: 'Medium',
        customerDueDate: '',
        r1DueDate: '',
        selectedScopes: [],
        smeOverride: null,
        hasDeviations: 'No',
        l2l3Required: 'No',
        l6Required: 'No',
        cmuInvolvement: 'No',
        tasks: [],
        taskStatuses: {}
      };
      appState.deals.push(deal);
      appState.activeDealId = id;
      saveState();
    }

    function getActiveDeal() {
      return appState.deals.find(d => d.id === appState.activeDealId);
    }

    function updateActiveDeal(updates) {
      const deal = getActiveDeal();
      if (deal) {
        Object.assign(deal, updates);
        saveState();
      }
    }

    function deleteDeal(dealId) {
      appState.deals = appState.deals.filter(d => d.id !== dealId);
      if (appState.activeDealId === dealId) {
        appState.activeDealId = appState.deals[0]?.id || null;
      }
      if (appState.deals.length === 0) {
        createNewDeal();
      }
      saveState();
    }

    function renameDeal(dealId, newName) {
      const deal = appState.deals.find(d => d.id === dealId);
      if (deal) {
        deal.name = newName || `Deal ${appState.deals.indexOf(deal) + 1}`;
        saveState();
      }
    }

    // ============================================
    // TIMELINE CALCULATIONS
    // ============================================

    function calculateTimeline(deal) {
      const complexityMap = {
        'Low — 4 Working Days': 4,
        'Medium — 10 Working Days': 10,
        'High — 20 Working Days': 20
      };
      const baseHorizon = complexityMap[deal.dealComplexity] || 10;

      // Calculate auto SME count
      const autoSMECount = deal.selectedScopes.filter(s => SCOPE_CONFIG[s]?.hasSME).length;
      const smeCount = deal.smeOverride !== null ? deal.smeOverride : autoSMECount;

      // SME buffer
      let smeBuffer = 0;
      if (smeCount >= 6) smeBuffer = 4;
      else if (smeCount >= 2) smeBuffer = 3;

      // Critical scope days
      const criticalScopeDays = deal.selectedScopes.length > 0
        ? Math.max(...deal.selectedScopes.map(s => SCOPE_CONFIG[s]?.days || 0))
        : 0;

      // Approval time
      let approvalTime = 0;
      if (deal.l2l3Required === 'Yes') approvalTime += 3;
      if (deal.l6Required === 'Yes') approvalTime += 3;

      // Additional critical path
      const additionalCriticalPath = Math.max(0, criticalScopeDays - baseHorizon) + Math.max(0, approvalTime - baseHorizon);

      // Recommended timeline
      const recommendedTimeline = baseHorizon + smeBuffer + Math.max(0, additionalCriticalPath);

      return {
        baseHorizon,
        autoSMECount,
        smeCount,
        smeBuffer,
        criticalScopeDays,
        approvalTime,
        additionalCriticalPath,
        recommendedTimeline
      };
    }

    function calculateDates(deal) {
      if (!deal.customerDueDate) return {};

      const customerDue = new Date(deal.customerDueDate);
      const timeline = calculateTimeline(deal);
      const recommendedStartDate = subtractWorkingDays(customerDue, timeline.recommendedTimeline);
      const internalSubmissionTarget = subtractWorkingDays(customerDue, 2);
      const recommendedR1Date = addWorkingDays(recommendedStartDate, Math.round(timeline.recommendedTimeline * 0.4));

      return {
        recommendedStartDate,
        internalSubmissionTarget,
        recommendedR1Date,
        customerDue
      };
    }

    function calculateScheduleRisk(deal) {
      if (!deal.customerDueDate) return 'unknown';

      const today = new Date();
      const dates = calculateDates(deal);
      const timeline = calculateTimeline(deal);
      const available = countWorkingDays(today, dates.customerDue);

      if (available >= timeline.recommendedTimeline + 3) return 'green';
      if (available >= timeline.recommendedTimeline) return 'yellow';
      return 'red';
    }

    // ============================================
    // TASK GENERATION
    // ============================================

    function generateTasks(deal) {
      if (!deal.customerDueDate) return [];

      const complexityMap = {
        'Low — 4 Working Days': 4,
        'Medium — 10 Working Days': 10,
        'High — 20 Working Days': 20
      };
      const windowDays = complexityMap[deal.dealComplexity] || 10;

      const customerDue = new Date(deal.customerDueDate);
      const internalTarget = subtractWorkingDays(customerDue, 2);

      const tasks = [];
      let idCounter = 0;

      function makeTask(name, owner, slot, phase, isGate = false) {
        const clampedSlot = Math.min(slot, windowDays - 1);
        const date = subtractWorkingDays(internalTarget, clampedSlot);
        tasks.push({
          id: 'task_' + Date.now() + '_' + (idCounter++),
          name, owner,
          dueDate: new Date(date),
          phase, isGate,
          status: 'Not Started'
        });
      }

      // Phase boundaries (slot 0 = internalTarget = latest, slot windowDays-1 = earliest)
      // Phase 3 occupies the LAST 30% of the window (slots closest to deadline: 0..p3Start)
      // Phase 2 occupies the MIDDLE 40% (slots p3Start+1..p2Start)
      // Phase 1 occupies the FIRST 30% (slots p2Start+1..windowDays-1, furthest from deadline)

      const p3End   = 0;
      const p3Start = Math.round(windowDays * 0.30);
      const p2End   = p3Start + 1;
      const p2Start = Math.round(windowDays * 0.70);
      const p1End   = p2Start + 1;
      const p1Start = windowDays - 1;

      // slotInRange: index 0 = rangeStart (earliest in this phase range), index count-1 = rangeEnd (latest in this phase range)
      // For Phase 1: rangeStart = p1Start (furthest from deadline), rangeEnd = p1End (closest to Phase 2 boundary)
      // For Phase 2: rangeStart = p2Start, rangeEnd = p2End
      // For Phase 3: rangeStart = p3Start, rangeEnd = p3End (= 0 = internalTarget)
      function slotInRange(index, count, rangeStart, rangeEnd) {
        if (count <= 1) return rangeEnd;
        const span = rangeStart - rangeEnd;
        // index 0 → rangeStart (earliest), index count-1 → rangeEnd (latest)
        return Math.round(rangeStart - (span * index / (count - 1)));
      }

      // ─── PHASE 1: Forward chronological order (Opportunity Identified → R1 Decision) ───
      // index 0 = earliest slot (furthest from deadline) = Opportunity Identified
      // last index = latest slot (closest to Phase 2) = R1 Decision (Gate)
      const p1Tasks = [];
      p1Tasks.push(['Opportunity Identified',                  'CM',     false]);
      p1Tasks.push(['R0 Review (CM & SM)',                     'CM/SM',  false]);
      p1Tasks.push(['Opportunity Entered into SFDC',           'CM',     false]);
      deal.selectedScopes.forEach(scope => {
        p1Tasks.push([`${scope} Scope Review`,                 'CM/SME', false]);
      });
      if (deal.cmuInvolvement === 'Yes') {
        p1Tasks.push(['CMU Involvement Review',                'CM/CMU', false]);
      }
      p1Tasks.push(['Opportunity R1 Submitted to CM',          'CM',     false]);
      p1Tasks.push(['R1 SME Meeting',                          'CM/SME', false]);
      p1Tasks.push(['R1 Meeting Minutes Entered into SFDC',    'CM',     false]);
      p1Tasks.push(['R1 Decision',                             'CM',     true]);  // Gate — LAST in Phase 1
      p1Tasks.forEach(([name, owner, isGate], i) => {
        makeTask(name, owner, slotInRange(i, p1Tasks.length, p1Start, p1End), 'Phase 1', isGate);
      });

      // ─── PHASE 2: Forward chronological order (Commercial Risk Analysis → last approval step) ───
      // index 0 = earliest slot = Commercial Risk Analysis
      // last index = latest slot (closest to Phase 3) = last approval/deviation task
      const p2Tasks = [];
      p2Tasks.push(['Commercial Risk Analysis',                      'CM',        false]);
      p2Tasks.push(['Commercial Financial & Pricing Review',         'CM/Finance',false]);
      p2Tasks.push(['SME Discussions & Recommendations',             'SME/CM',    false]);
      p2Tasks.push(['SME Cost-Price & Scope Development',            'SME',       false]);
      p2Tasks.push(['CPQ Quote Creation',                            'CM/Pricing',false]);
      p2Tasks.push(['CM Selects Risk Triggers',                      'CM',        false]);
      p2Tasks.push(['Any Deviations? — Decision Point',              'CM',        false]);
      if (deal.hasDeviations === 'Yes' && deal.l2l3Required !== 'Yes') {
        p2Tasks.push(['Submit Standard Terms in SFDC',               'CM',        false]);
      }
      if (deal.l2l3Required === 'Yes') {
        p2Tasks.push(['Prepare Deal Summary',                         'CM',        false]);
        p2Tasks.push(['Submit Deviations in SFDC',                    'CM',        false]);
        p2Tasks.push(['Schedule L2/L3 R2 Meeting',                    'CM',        false]);
        p2Tasks.push(['Obtain L2/L3 Approval',                        'CM/L2/L3',  true]);  // Gate
      }
      if (deal.l6Required === 'Yes') {
        p2Tasks.push(['Request L6 Approval',                          'CM',        false]);
        p2Tasks.push(['Submit Deal Summary to Approvers and SMEs',    'CM',        false]);
        p2Tasks.push(['Conduct Aero PS Review & Approval Call',       'CM/CSL',    false]);
        p2Tasks.push(['Record L6 Approval & R2 Minutes in SFDC',      'CM',        false]);
      }
      p2Tasks.forEach(([name, owner, isGate], i) => {
        makeTask(name, owner, slotInRange(i, p2Tasks.length, p2Start, p2End), 'Phase 2', isGate);
      });

      // ─── PHASE 3: Forward chronological order (Proposal Development → Submit Proposal to Customer) ───
      // index 0 = earliest slot = Proposal Development by CM
      // last index = latest slot (closest to internalTarget) = Submit Proposal to Customer
      const p3Tasks = [];
      p3Tasks.push(['Proposal Development by CM',          'CM',         false]);
      p3Tasks.push(['Final Revision by CM, SM, and CSL',   'CM/SM/CSL',  false]);
      p3Tasks.push(['Upload Final Proposal into SFDC',     'CM',         false]);
      p3Tasks.push(['Submit R2 Offer in SFDC',             'CM',         false]);
      p3Tasks.push(['Submit Proposal to Customer',         'CM/SM',      false]);  // LAST
      p3Tasks.forEach(([name, owner, isGate], i) => {
        makeTask(name, owner, slotInRange(i, p3Tasks.length, p3Start, p3End), 'Phase 3', isGate);
      });

      // Sort ascending by date so Phase 1 tasks appear first, Phase 3 last
      tasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      return tasks;
    }

    // ============================================
    // RENDER FUNCTIONS

    function renderDealSwitcher() {
      const switcher = document.getElementById('dealSwitcher');
      switcher.innerHTML = '';

      appState.deals.forEach(deal => {
        const pill = document.createElement('div');
        pill.className = 'deal-pill' + (deal.id === appState.activeDealId ? ' active' : '');
        pill.innerHTML = `
          <span class="deal-pill-name" id="dealname-${deal.id}">${deal.name}</span>
          <button class="deal-pill-rename" onclick="startRenameDealById(event, '${deal.id}')" title="Rename deal">✏️</button>
          <button class="deal-pill-delete" onclick="confirmDeleteDeal('${deal.id}')">×</button>
        `;
        pill.addEventListener('click', (e) => {
          if (!e.target.classList.contains('deal-pill-delete') && !e.target.classList.contains('deal-pill-rename')) {
            appState.activeDealId = deal.id;
            saveState();
            render();
          }
        });
        switcher.appendChild(pill);
      });

      if (appState.deals.length < 8) {
        const addPill = document.createElement('button');
        addPill.className = 'deal-pill deal-pill-add';
        addPill.textContent = '+ New Deal';
        addPill.onclick = () => {
          createNewDeal();
          render();
        };
        switcher.appendChild(addPill);
      }
    }

    function renderTabNav() {

    function switchTab(tabName) {
      document.getElementById('masterViewBarBtn').classList.remove('active');
      currentActiveTab = tabName;

      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (tabName === 'bidSetup') {
        document.getElementById('bidSetupTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else if (tabName === 'gantt') {
        document.getElementById('ganttTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        renderGanttTab();
      } else if (tabName === 'execSummary') {
        document.getElementById('execSummaryTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        renderExecSummaryTab();
      } else if (tabName === 'masterView') {
        document.getElementById('masterViewTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[3].classList.add('active');
        renderMasterViewTab();
      }
    }

    function renderGanttTab() {
      const deal = getActiveDeal();
      const container = document.getElementById('ganttTab');

      if (deal.tasks.length === 0) {
        container.innerHTML = '<p style="padding: 20px; text-align: center; color: #999;">No tasks generated yet. Go to Bid Setup and click "Generate Timeline" to create tasks.</p>';
        return;
      }

      const today = new Date();
      const dates = calculateDates(deal);

      // Calculate KPIs
      const totalTasks = deal.tasks.length;
      const completeTasks = deal.tasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const overdueTasks = deal.tasks.filter(t => {
        const dueDate = new Date(t.dueDate);
        return dueDate < today && deal.taskStatuses[t.id] !== 'Complete';
      });
      const atRiskTasks = deal.tasks.filter(t => {
        const dueDate = new Date(t.dueDate);
        const daysUntilDue = countWorkingDays(today, dueDate);
        return daysUntilDue <= 3 && daysUntilDue > 0 && deal.taskStatuses[t.id] !== 'Complete';
      });

      const daysToDeadline = dates.customerDue ? countWorkingDays(today, dates.customerDue) : 0;
      const percentComplete = totalTasks > 0 ? Math.round((completeTasks / totalTasks) * 100) : 0;

      // Overdue banner
      const overdueBannerHtml = `<div class="overdue-banner${overdueTasks.length === 0 ? ' hidden' : ''}" id="overdueBanner"><div class="overdue-banner-icon">⚠</div><div>${overdueTasks.length > 0 ? overdueTasks.length + ' overdue task(s): ' + overdueTasks.map(t => t.name).join(', ') : ''}</div></div>`;

       // Build gantt table
       let tableHtml = '<table class="gantt-table"><thead><tr><th>Task Name</th><th>Owner</th><th>Due Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="ganttTableBody">';

       const phases = ['Phase 1', 'Phase 2', 'Phase 3'];
       phases.forEach(phase => {
         const phaseTasks = deal.tasks.filter(t => t.phase === phase);
         if (phaseTasks.length > 0) {
           tableHtml += `<tr class="phase-header" data-phase-header="${phase}"><td colspan="5">${phase}</td></tr>`;
           phaseTasks.forEach(task => {
             const status = deal.taskStatuses[task.id] || 'Not Started';
             const dueDate = new Date(task.dueDate);
             const isOverdue = dueDate < today && status !== 'Complete';
             const isAtRisk = countWorkingDays(today, dueDate) <= 3 && countWorkingDays(today, dueDate) > 0 && status !== 'Complete';
             const rowClass = `${isOverdue ? 'overdue' : ''} ${status === 'Complete' ? 'complete' : ''} ${task.isGate ? 'gate' : ''}`;
             tableHtml += `
               <tr class="${rowClass}" data-task-id="${task.id}" data-phase="${task.phase}" data-gate="${task.isGate ? 'true' : 'false'}" data-overdue="${isOverdue ? 'true' : 'false'}">
                 <td><span class="task-name ${task.isGate ? 'gate' : ''}">${task.name}</span></td>
                 <td><span class="task-owner">${task.owner}</span></td>
                 <td><span class="task-due">${formatDate(dueDate)}</span></td>
                 <td>
                   <select class="task-status-select" onchange="updateTaskStatus('${task.id}', this.value)">
                     <option ${status === 'Not Started' ? 'selected' : ''}>Not Started</option>
                     <option ${status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                     <option ${status === 'Complete' ? 'selected' : ''}>Complete</option>
                     <option ${status === 'Blocked' ? 'selected' : ''}>Blocked</option>
                   </select>
                 </td>
                 <td>
                   <button class="task-action-btn" onclick="updateTaskStatus('${task.id}', 'Complete')" ${status === 'Complete' ? 'disabled' : ''}>Mark Complete</button>
                 </td>
               </tr>
             `;
           });
         }
       });

      tableHtml += '</tbody></table>';

      container.innerHTML = `
        <div class="gantt-container">
          <div class="kpi-bar">
            <div class="kpi-card">
              <div class="kpi-label">Days to Deadline</div>
              <div class="kpi-value">${daysToDeadline}</div>
              <div class="kpi-detail">Due: ${formatDate(dates.customerDue)}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Tasks Complete</div>
              <div class="kpi-value">${completeTasks} / ${totalTasks}</div>
              <div class="kpi-detail">${percentComplete}% progress</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Overdue Tasks</div>
              <div class="kpi-value" style="color: ${overdueTasks.length > 0 ? '#ef4444' : '#22c55e'};">${overdueTasks.length}</div>
              <div class="kpi-detail">Requires immediate action</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">At Risk (3 days)</div>
              <div class="kpi-value" style="color: ${atRiskTasks.length > 0 ? '#f59e0b' : '#22c55e'};">${atRiskTasks.length}</div>
              <div class="kpi-detail">Due within 3 working days</div>
            </div>
          </div>
          ${overdueBannerHtml}
           <div class="filter-pills">
             <button class="filter-pill active" onclick="filterGantt('all', this)">All</button>
             <button class="filter-pill" onclick="filterGantt('phase1', this)">Phase 1</button>
             <button class="filter-pill" onclick="filterGantt('phase2', this)">Phase 2</button>
             <button class="filter-pill" onclick="filterGantt('phase3', this)">Phase 3</button>
             <button class="filter-pill" onclick="filterGantt('gates', this)">Gates Only</button>
             <button class="filter-pill" onclick="filterGantt('overdue', this)">Overdue</button>
           </div>
          ${tableHtml}
        </div>
       `;
       
       // Reapply current filter after render
       if (currentGanttFilter !== 'all') {
         filterGantt(currentGanttFilter);
       }
        
     }

    function renderExecSummaryTab() {
      const deal = getActiveDeal();
      const container = document.getElementById('execSummaryTab');
      const timeline = calculateTimeline(deal);
      const dates = calculateDates(deal);
      const today = new Date();

      // KPIs
      const daysToDeadline = dates.customerDue ? countWorkingDays(today, dates.customerDue) : 0;
      const totalTasks = deal.tasks.length;
      const completeTasks = deal.tasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const percentComplete = totalTasks > 0 ? Math.round((completeTasks / totalTasks) * 100) : 0;
      const approvalsNeeded = (deal.l2l3Required === 'Yes' ? 1 : 0) + (deal.l6Required === 'Yes' ? 1 : 0);
      const approvalsOverdue = 0; // Simplified
      const deviationsOpen = deal.hasDeviations === 'Yes' ? 1 : 0;
      const scheduleRisk = calculateScheduleRisk(deal);

      // Phase progress
      const phase1Tasks = deal.tasks.filter(t => t.phase === 'Phase 1');
      const phase2Tasks = deal.tasks.filter(t => t.phase === 'Phase 2');
      const phase3Tasks = deal.tasks.filter(t => t.phase === 'Phase 3');

      const phase1Complete = phase1Tasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const phase2Complete = phase2Tasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const phase3Complete = phase3Tasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;

      const phase1Percent = phase1Tasks.length > 0 ? Math.round((phase1Complete / phase1Tasks.length) * 100) : 0;
      const phase2Percent = phase2Tasks.length > 0 ? Math.round((phase2Complete / phase2Tasks.length) * 100) : 0;
      const phase3Percent = phase3Tasks.length > 0 ? Math.round((phase3Complete / phase3Tasks.length) * 100) : 0;

          return d < today && deal.taskStatuses[t.id] !== 'Complete';
        }).length;
        const pct = totalTasks > 0 ? Math.round((completeTasks / totalTasks) * 100) : 0;

      renderDealSwitcher();
      renderTabNav();

      // Always re-render bid setup (it drives the other tabs)
      renderBidSetupTab();

      // Only re-render Gantt and Exec Summary if they are currently active
      // to avoid wiping in-place DOM updates
      if (currentActiveTab === 'gantt') {
        renderGanttTab();
      } else if (currentActiveTab === 'execSummary') {
        renderExecSummaryTab();
      } else if (currentActiveTab === 'masterView') {
        renderMasterViewTab();
      }

      // Restore correct tab visibility
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      if (currentActiveTab === 'bidSetup') {
        document.getElementById('bidSetupTab').classList.add('active');
      } else if (currentActiveTab === 'gantt') {
        document.getElementById('ganttTab').classList.add('active');
      } else if (currentActiveTab === 'execSummary') {
        document.getElementById('execSummaryTab').classList.add('active');
      } else if (currentActiveTab === 'masterView') {
        document.getElementById('masterViewTab').classList.add('active');

    function updateScope(scope, checked) {
      const deal = getActiveDeal();
      if (checked) {
        if (!deal.selectedScopes.includes(scope)) {
          deal.selectedScopes.push(scope);
        }
      } else {
        deal.selectedScopes = deal.selectedScopes.filter(s => s !== scope);
      }
      saveState();
      render();
    }

      const deal = getActiveDeal();
      deal.smeOverride = value ? parseInt(value) : null;

      const deal = getActiveDeal();

        alert('Please enter a Customer Due Date before generating the timeline.');
        return;
      }

      deal.tasks = generateTasks(deal);
      deal.taskStatuses = {};

      });

    }

    function updateTaskStatus(taskId, newStatus) {
      // 1. Persist the status change
      const deal = getActiveDeal();
      deal.taskStatuses[taskId] = newStatus;
      saveState();

      // 2. Update the row in-place — find the row by data-task-id
      const row = document.querySelector(`tr[data-task-id="${taskId}"]`);
      if (!row) return;

      const today = new Date();
      const task = deal.tasks.find(t => t.id === taskId);
      if (!task) return;
      const dueDate = new Date(task.dueDate);
      const isOverdue = dueDate < today && newStatus !== 'Complete';
      const isComplete = newStatus === 'Complete';

      // 3. Update row classes in-place
      row.classList.toggle('complete', isComplete);
      row.classList.toggle('overdue', isOverdue);
      row.dataset.overdue = isOverdue ? 'true' : 'false';


       // Apply inline styles for complete status
       if (isComplete) {
         row.style.backgroundColor = '#f0fdf4';
         row.style.borderLeft = '4px solid #22c55e';
       } else {
         row.style.backgroundColor = '';
         row.style.borderLeft = isOverdue ? '4px solid #ef4444' : '';
       }

      // 4. Sync the status dropdown to the new value (avoid change-event loop)
      const sel = row.querySelector('.task-status-select');
      if (sel && sel.value !== newStatus) sel.value = newStatus;

      // 5. Update Mark Complete button disabled state
      const btn = row.querySelector('.task-action-btn');
      if (btn) btn.disabled = isComplete;

      // 6. Recalculate and update the 4 KPI cards in-place
      const allTasks = deal.tasks;
      const totalTasks = allTasks.length;
      const completeTasks = allTasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const percentComplete = totalTasks > 0 ? Math.round((completeTasks / totalTasks) * 100) : 0;
      const overdueTasks = allTasks.filter(t => {
        const d = new Date(t.dueDate);
        return d < today && deal.taskStatuses[t.id] !== 'Complete';
      });
      const atRiskTasks = allTasks.filter(t => {
        const d = new Date(t.dueDate);
        const wd = countWorkingDays(today, d);
        return wd <= 3 && wd > 0 && deal.taskStatuses[t.id] !== 'Complete';
      });

      // Update KPI card values — select by position in .kpi-bar
      const kpiCards = document.querySelectorAll('.kpi-bar .kpi-card');
      if (kpiCards[1]) kpiCards[1].querySelector('.kpi-value').textContent = `${completeTasks} / ${totalTasks}`;
      if (kpiCards[1]) kpiCards[1].querySelector('.kpi-detail').textContent = `${percentComplete}% progress`;
      if (kpiCards[2]) {
        kpiCards[2].querySelector('.kpi-value').textContent = overdueTasks.length;
        kpiCards[2].querySelector('.kpi-value').style.color = overdueTasks.length > 0 ? '#ef4444' : '#22c55e';
      }
      if (kpiCards[3]) {
        kpiCards[3].querySelector('.kpi-value').textContent = atRiskTasks.length;
        kpiCards[3].querySelector('.kpi-value').style.color = atRiskTasks.length > 0 ? '#f59e0b' : '#22c55e';
      }

      // 7. Update overdue banner in-place
      const banner = document.querySelector('.overdue-banner');
      if (banner) {
        if (overdueTasks.length > 0) {
          banner.classList.remove('hidden');
          const divs = banner.querySelectorAll('div');
          if (divs[1]) divs[1].textContent = overdueTasks.length + ' overdue task(s): ' + overdueTasks.map(t => t.name).join(', ');
        } else {
          banner.classList.add('hidden');
        }
      }
    }


    function switchToMasterView() {
      currentActiveTab = 'masterView';
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById('masterViewTab').classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('masterViewBarBtn').classList.add('active');
      renderMasterViewTab();
    }

    function filterGantt(filter, btn) {
      currentGanttFilter = filter;

      // Update active pill state
      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.classList.remove('active');
        const pillText = pill.textContent.trim().toLowerCase();
        if (
          (filter === 'all' && pillText === 'all') ||
          (filter === 'phase1' && pillText === 'phase 1') ||
          (filter === 'phase2' && pillText === 'phase 2') ||
          (filter === 'phase3' && pillText === 'phase 3') ||
          (filter === 'gates' && pillText === 'gates only') ||
          (filter === 'overdue' && pillText === 'overdue')
        ) {
          pill.classList.add('active');
        }
      });

      const rows = document.querySelectorAll('#ganttTableBody tr');

      rows.forEach(row => {
        let shouldShow = false;

        if (filter === 'all') {
          shouldShow = true;
        } else if (filter === 'phase1') {
          shouldShow = row.dataset.phase === 'Phase 1' || row.dataset.phaseHeader === 'Phase 1';
        } else if (filter === 'phase2') {
          shouldShow = row.dataset.phase === 'Phase 2' || row.dataset.phaseHeader === 'Phase 2';
        } else if (filter === 'phase3') {
          shouldShow = row.dataset.phase === 'Phase 3' || row.dataset.phaseHeader === 'Phase 3';
        } else if (filter === 'gates') {
          shouldShow = row.dataset.gate === 'true' || !!row.dataset.phaseHeader;
        } else if (filter === 'overdue') {
          shouldShow = row.dataset.overdue === 'true' || !!row.dataset.phaseHeader;
        }

        row.style.display = shouldShow ? '' : 'none';
      });
    }

    function updateDelaySimulator() {
      const deal = getActiveDeal();
      const dates = calculateDates(deal);
      const timeline = calculateTimeline(deal);
      const today = new Date();

      const delayDays = parseInt(document.getElementById('delayDaysSlider')?.value || 1);
      document.getElementById('delayDaysValue').textContent = delayDays;

      const newSubmissionTarget = addWorkingDays(dates.internalSubmissionTarget, delayDays);
      const newAvailable = countWorkingDays(today, dates.customerDue) - delayDays;
      const newRisk = newAvailable >= timeline.recommendedTimeline + 3 ? 'green' : newAvailable >= timeline.recommendedTimeline ? 'yellow' : 'red';

      document.getElementById('delayNewSubmission').textContent = formatDate(newSubmissionTarget);
      document.getElementById('delayCompression').textContent = `${delayDays} working days`;
      document.getElementById('delayRiskStatus').textContent = newRisk === 'green' ? '✓ Green' : newRisk === 'yellow' ? '⚠ Yellow' : '✗ Red';
    }

    function startRenameDeal(event, dealId) {
      event.stopPropagation();
      const deal = appState.deals.find(d => d.id === dealId);
      const nameSpan = event.target;
      const currentName = deal.name;
      nameSpan.contentEditable = true;
      nameSpan.focus();
      nameSpan.onblur = () => {
        nameSpan.contentEditable = false;
        const newName = nameSpan.textContent.trim();
        if (newName) {
          renameDeal(dealId, newName);
        } else {
          nameSpan.textContent = currentName;
        }
        render();
      };
      nameSpan.onkeydown = (e) => {
        if (e.key === 'Enter') {
          nameSpan.blur();
        }
      };
    }

    function startRenameDealById(event, dealId) {
      event.stopPropagation();
      const deal = appState.deals.find(d => d.id === dealId);
      if (!deal) return;
      const currentName = deal.name;
      const nameSpan = document.getElementById('dealname-' + dealId);
      if (!nameSpan) return;
      nameSpan.contentEditable = true;
      nameSpan.style.outline = '2px solid var(--gev-lime)';
      nameSpan.style.borderRadius = '3px';
      nameSpan.style.padding = '1px 4px';
      nameSpan.focus();
      // Select all text
      const range = document.createRange();
      range.selectNodeContents(nameSpan);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      nameSpan.onblur = () => {
        nameSpan.contentEditable = false;
        nameSpan.style.outline = '';
        nameSpan.style.borderRadius = '';
        nameSpan.style.padding = '';
        const newName = nameSpan.textContent.trim();
        if (newName && newName !== currentName) {
          renameDeal(dealId, newName);
          renderDealSwitcher();
          renderTabNav();
        } else {
          nameSpan.textContent = currentName;
        }
      };
      nameSpan.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); nameSpan.blur(); }
        if (e.key === 'Escape') { nameSpan.textContent = currentName; nameSpan.blur(); }
      };
    }


    function confirmDeleteDeal(dealId) {
      showModal(
        'Delete Deal',
        'Are you sure you want to delete this deal? This action cannot be undone.',
        () => {
          deleteDeal(dealId);
          render();
          closeModal();
        }
      );
    }

    function confirmReset() {
      showModal(
        'Reset All Deals',
        'Are you sure you want to reset all deals? This will clear all data and cannot be undone.',
        () => {
          localStorage.removeItem('gevITO_v2');
          appState = { deals: [], activeDealId: null };
          initializeState();
          render();
          closeModal();
        }
      );
    }

    function showModal(title, content, onConfirm) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').textContent = content;
      document.getElementById('modalConfirmBtn').onclick = onConfirm;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // ============================================
    // INITIALIZATION
    // ============================================

    initializeState();
    render();
  </script>
</body>
