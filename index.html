<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GE Vernova Aero Services — ITO Policy 5.0 Bid Timeline Management Tool</title>
  <style>
    /* ============================================
       GE VERNOVA DESIGN SYSTEM — COMPLETE CSS
       ============================================ */

    :root {
      /* Primary palette */
      --color-dk1:      #005E60;   /* Evergreen */
      --color-lt1:      #FFFFFF;   /* Day */
      --color-dk2:      #212121;   /* Night */
      --color-lt2:      #C8FF08;   /* Urgency Green */

      /* Evergreen tints */
      --color-accent1:  #004745;   /* Dark Evergreen */
      --color-accent6:  #458A8A;   /* Evergreen Tint 1 */
      --color-tint-2:   #96BDBD;   /* Evergreen Tint 2 */
      --color-tint-3:   #C7DBDB;   /* Evergreen Tint 3 */

      /* Grays */
      --color-gray-1:   #FAFAFA;   /* Gray 1 */
      --color-accent2:  #E3E3E3;   /* Gray 2 */
      --color-accent3:  #CCCCCC;   /* Gray 3 */
      --color-accent4:  #696969;   /* Gray 4 */
      --color-accent5:  #484848;   /* Gray 5 */

      /* Tertiary (charts only) */
      --color-hlink:      #2176FF; /* Dark Sky */
      --color-sky:        #5FB7FF; /* Sky */
      --color-fol-hlink:  #3E9E00; /* Dark Forest */
      --color-forest:     #7BDD3C; /* Forest */
      --color-dark-earth: #4A2419; /* Dark Earth */
      --color-earth:      #774936; /* Earth */

      /* Typography */
      --font-heading: "Sons Condensed Extrabold", "Inter", "Segoe UI", sans-serif;
      --font-body:    "Inter", "Segoe UI", sans-serif;

      /* Application-specific overrides */
      --gev-navy:     #1B3A6B;
      --gev-teal:     #005E60;
      --gev-blue:     #00A3E0;
      --gev-lime:     #C8FF08;
      --gev-dark:     #1a1a2e;
      --gev-light:    #f4f7fb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: var(--font-body);
      background-color: var(--color-lt1);
      color: var(--color-dk2);
      line-height: 1.6;
    }

    /* ============================================
       HEADER
       ============================================ */

    .header {
      background: linear-gradient(135deg, var(--gev-navy) 0%, var(--gev-dark) 100%);
      color: var(--color-lt1);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--color-lt1);
      position: relative;
      padding-bottom: 4px;
    }

    .header-logo::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--gev-lime);
      border-radius: 2px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .header-title p {
      font-size: 12px;
      opacity: 0.9;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      gap: 12px;
    }

    .btn-reset {
      background-color: #ef4444;
      color: var(--color-lt1);
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-reset:hover {
      background-color: #dc2626;
    }

    /* ============================================
       DEAL SWITCHER BAR
       ============================================ */

    .deal-switcher {
      background-color: var(--color-gray-1);
      padding: 12px 32px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--color-accent2);
      overflow-x: auto;
      flex-wrap: wrap;
    }

    .deal-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .deal-pill:hover {
      border-color: var(--gev-teal);
    }

    .deal-pill.active {
      background-color: var(--gev-teal);
      color: var(--color-lt1);
      border-color: var(--gev-teal);
    }

    .deal-pill-name {
      cursor: text;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deal-pill-delete {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .deal-pill-delete:hover {
      opacity: 1;
    }

    .deal-pill-add {
      background-color: var(--gev-lime);
      color: var(--gev-dark);
      border: 1px solid var(--gev-lime);
      font-weight: 600;
    }

    .deal-pill-add:hover {
      background-color: #b8e600;
      border-color: #b8e600;
    }

    .deal-pill-add:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ============================================
       TAB NAVIGATION
       ============================================ */

    .tab-nav {
      display: flex;
      gap: 0;
      background-color: var(--color-lt1);
      border-bottom: 2px solid var(--color-accent2);
      padding: 0 32px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent4);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }

    .tab-btn:hover {
      color: var(--gev-teal);
    }

    .tab-btn.active {
      color: var(--gev-teal);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--gev-teal);
    }

    /* ============================================
       TAB CONTENT
       ============================================ */

    .tab-content {
      display: none;
      padding: 24px 32px;
      animation: fadeIn 0.2s ease-in;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ============================================
       BID SETUP TAB — LAYOUT
       ============================================ */

    .bid-setup-container {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
    }

    .bid-setup-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .bid-setup-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ============================================
       FORM SECTIONS
       ============================================ */

    .form-section {
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .form-section-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--gev-navy);
      border-left: 4px solid var(--gev-teal);
      padding-left: 12px;
      margin: 0;
    }

    .form-section-toggle {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: var(--gev-teal);
    }

    .form-section.collapsed .form-section-content {
      display: none;
    }

    .form-section-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-dk2);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 12px;
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font-body);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gev-teal);
      box-shadow: 0 0 0 3px rgba(0, 94, 96, 0.1);
    }

    .form-group-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    /* ============================================
       RADIO TOGGLES
       ============================================ */

    .radio-group {
      display: flex;
      gap: 12px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      cursor: pointer;
      accent-color: var(--gev-teal);
    }

    .radio-option label {
      cursor: pointer;
      font-size: 13px;
      margin: 0;
    }

    /* ============================================
       SCOPE SELECTION GRID
       ============================================ */

    .scope-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .scope-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .scope-checkbox:hover {
      border-color: var(--gev-teal);
      background-color: #f0fffe;
    }

    .scope-checkbox input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--gev-teal);
    }

    .scope-checkbox-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }

    .scope-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-dk2);
    }

    .scope-meta {
      font-size: 11px;
      color: var(--color-accent4);
    }

    .scope-badge {
      display: inline-block;
      background-color: var(--gev-teal);
      color: var(--color-lt1);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      margin-top: 2px;
      width: fit-content;
    }

    /* ============================================
       SCOPE SUMMARY PANEL
       ============================================ */

    .scope-summary {
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
    }

    .scope-summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scope-summary-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-accent4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scope-summary-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--gev-navy);
    }

    .scope-summary-note {
      grid-column: 1 / -1;
      font-size: 11px;
      color: var(--color-accent4);
      font-style: italic;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--color-accent3);
    }

    /* ============================================
       ALERT BADGES
       ============================================ */

    .alert-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
    }

    .alert-badge.green {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
      color: #166534;
    }

    .alert-badge.yellow {
      background-color: #fffbeb;
      border-left: 4px solid #f59e0b;
      color: #92400e;
    }

    .alert-badge.red {
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
    }

    .alert-badge.blue {
      background-color: #eff6ff;
      border-left: 4px solid #3b82f6;
      color: #1e40af;
    }

    .alert-badge-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .alert-badge-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .alert-badge-title {
      font-weight: 700;
    }

    .alert-badge-detail {
      font-size: 12px;
      opacity: 0.9;
    }

    /* ============================================
       ITO WORKFLOW STEPPER
       ============================================ */

    .ito-stepper {
      background-color: #f8f9fa;
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ito-stepper-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gev-navy);
      border-left: 4px solid var(--gev-teal);
      padding-left: 12px;
      margin: 0;
    }

    .ito-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ito-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }

    .ito-step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--color-accent2);
      border: 2px solid var(--color-accent3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-accent4);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .ito-step.active .ito-step-circle {
      background-color: var(--gev-teal);
      border-color: var(--gev-teal);
      color: var(--color-lt1);
    }

    .ito-step.dimmed .ito-step-circle {
      opacity: 0.4;
    }

    .ito-step-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 4px;
    }

    .ito-step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-dk2);
    }

    .ito-step.dimmed .ito-step-label {
      opacity: 0.5;
    }

    .ito-step-desc {
      font-size: 11px;
      color: var(--color-accent4);
    }

    .ito-step.dimmed .ito-step-desc {
      opacity: 0.5;
    }

    /* ============================================
       BUTTONS
       ============================================ */

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-primary {
      background-color: var(--gev-teal);
      color: var(--color-lt1);
    }

    .btn-primary:hover {
      background-color: var(--color-accent1);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: var(--color-accent2);
      color: var(--color-dk2);
    }

    .btn-secondary:hover {
      background-color: var(--color-accent3);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }

    .btn-full-width {
      width: 100%;
    }

    /* ============================================
       GANTT CHART TAB
       ============================================ */

    .gantt-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .kpi-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .kpi-card {
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-accent4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--gev-navy);
    }

    .kpi-detail {
      font-size: 12px;
      color: var(--color-accent4);
    }

    /* ============================================
       OVERDUE BANNER
       ============================================ */

    .overdue-banner {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid #ef4444;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #991b1b;
      font-weight: 500;
    }

    .overdue-banner-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .overdue-banner.hidden {
      display: none;
    }

    /* ============================================
       FILTER PILLS
       ============================================ */

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 8px 14px;
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-pill:hover {
      border-color: var(--gev-teal);
    }

    .filter-pill.active {
      background-color: var(--gev-teal);
      color: var(--color-lt1);
      border-color: var(--gev-teal);
    }

    /* ============================================
       GANTT TABLE
       ============================================ */

    .gantt-table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      overflow: hidden;
    }

    .gantt-table thead {
      background-color: var(--gev-navy);
      color: var(--color-lt1);
    }

    .gantt-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gantt-table td {
      padding: 12px 16px;
      border-top: 1px solid var(--color-accent2);
      font-size: 13px;
    }

    .gantt-table tbody tr {
      transition: background-color 0.2s;
    }

    .gantt-table tbody tr:hover {
      background-color: var(--color-gray-1);
    }

    .gantt-table tbody tr.phase-header {
      background-color: var(--gev-navy);
      color: var(--color-lt1);
      font-weight: 700;
    }

    .gantt-table tbody tr.phase-header:hover {
      background-color: var(--gev-navy);
    }

    .gantt-table tbody tr.overdue {
      background-color: #fff5f5;
      border-left: 4px solid #ef4444;
    }

    .gantt-table tbody tr.critical {
      font-weight: 700;
      border-left: 4px solid #f59e0b;
    }

    .gantt-table tbody tr.gate {
      background-color: #fef3c7;
      font-weight: 600;
    }

    .gantt-table tbody tr.complete {
      opacity: 0.6;
    }

    .gantt-table tbody tr.complete .task-name {
      text-decoration: line-through;
    }

    .task-name {
      font-weight: 500;
      color: var(--color-dk2);
    }

    .task-name.gate {
      font-weight: 700;
      color: #b45309;
    }

    .task-owner {
      font-size: 12px;
      color: var(--color-accent4);
    }

    .task-due {
      font-size: 12px;
      color: var(--color-dk2);
    }

    .task-status-select {
      padding: 6px 8px;
      border: 1px solid var(--color-accent2);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      background-color: var(--color-lt1);
    }

    .task-status-select:focus {
      outline: none;
      border-color: var(--gev-teal);
      box-shadow: 0 0 0 2px rgba(0, 94, 96, 0.1);
    }

    .task-action-btn {
      padding: 6px 12px;
      background-color: var(--gev-teal);
      color: var(--color-lt1);
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .task-action-btn:hover {
      background-color: var(--color-accent1);
    }

    .task-action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ============================================
       EXECUTIVE SUMMARY TAB
       ============================================ */

    .exec-summary-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .kpi-grid-2row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .card {
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gev-navy);
      border-left: 4px solid var(--gev-teal);
      padding-left: 12px;
      margin: 0;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-accent2);
    }

    .detail-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-label {
      font-weight: 600;
      color: var(--color-accent4);
    }

    .detail-value {
      font-weight: 600;
      color: var(--gev-navy);
    }

    .pill-tag {
      display: inline-block;
      background-color: var(--color-accent2);
      color: var(--color-dk2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: var(--color-accent2);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--gev-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-lt1);
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-dk2);
      margin-bottom: 6px;
    }

    .table-simple {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table-simple thead {
      background-color: var(--color-gray-1);
    }

    .table-simple th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 700;
      color: var(--gev-navy);
      border-bottom: 2px solid var(--color-accent2);
    }

    .table-simple td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-accent2);
    }

    .table-simple tbody tr:hover {
      background-color: var(--color-gray-1);
    }

    .risk-card {
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .risk-card.green {
      background-color: #f0fdf4;
      border: 1px solid #86efac;
    }

    .risk-card.yellow {
      background-color: #fffbeb;
      border: 1px solid #fcd34d;
    }

    .risk-card.red {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
    }

    .risk-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gev-navy);
    }

    .risk-card.green .risk-card-title {
      color: #166534;
    }

    .risk-card.yellow .risk-card-title {
      color: #92400e;
    }

    .risk-card.red .risk-card-title {
      color: #991b1b;
    }

    .risk-card-content {
      font-size: 13px;
      line-height: 1.6;
    }

    .risk-card-list {
      margin-top: 8px;
      padding-left: 20px;
    }

    .risk-card-list li {
      margin-bottom: 4px;
    }

    /* ============================================
       DELAY SIMULATOR
       ============================================ */

    .simulator-section {
      background-color: var(--color-lt1);
      border: 1px solid var(--color-accent2);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .simulator-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .simulator-output {
      background-color: var(--color-gray-1);
      border: 1px solid var(--color-accent2);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .simulator-output-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .simulator-output-label {
      font-weight: 600;
      color: var(--color-accent4);
    }

    .simulator-output-value {
      font-weight: 700;
      color: var(--gev-navy);
    }

    /* ============================================
       MODAL / DIALOG
       ============================================ */

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background-color: var(--color-lt1);
      border-radius: 8px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gev-navy);
      margin: 0;
    }

    .modal-content {
      font-size: 14px;
      color: var(--color-dk2);
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* ============================================
       PRINT STYLES
       ============================================ */

    @media print {
      .header,
      .deal-switcher,
      .tab-nav,
      .filter-pills,
      .btn-reset,
      .btn-full-width,
      .task-action-btn,
      .simulator-section,
      .modal-overlay {
        display: none !important;
      }

      .tab-content {
        display: block !important;
        page-break-after: always;
      }

      body {
        background-color: var(--color-lt1);
      }

      .gantt-table,
      .card,
      .form-section {
        page-break-inside: avoid;
      }
    }

    /* ============================================
       RESPONSIVE
       ============================================ */

    @media (max-width: 1280px) {
      .bid-setup-container {
        grid-template-columns: 1fr;
      }

      .bid-setup-right {
        order: -1;
      }

      .kpi-grid-2row {
        grid-template-columns: repeat(2, 1fr);
      }

      .scope-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .header-right {
        width: 100%;
      }

      .btn-reset {
        width: 100%;
      }

      .deal-switcher {
        padding: 12px 16px;
      }

      .tab-nav {
        padding: 0 16px;
      }

      .tab-content {
        padding: 16px;
      }

      .kpi-bar {
        grid-template-columns: repeat(2, 1fr);
      }

      .kpi-grid-2row {
        grid-template-columns: 1fr;
      }

      .scope-grid {
        grid-template-columns: 1fr;
      }

      .form-group-row {
        grid-template-columns: 1fr;
      }

      .form-group-row.three {
        grid-template-columns: 1fr;
      }

      .simulator-controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">GEV</div>
      <div class="header-title">
        <h1>Aero Services · ITO Policy 5.0 — Bid Timeline Manager</h1>
        <p>Commercial Excellence</p>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-reset" onclick="confirmReset()">🔄 Reset All</button>
    </div>
  </header>

  <!-- DEAL SWITCHER BAR -->
  <div class="deal-switcher" id="dealSwitcher"></div>

  <!-- TAB NAVIGATION -->
  <div class="tab-nav" id="tabNav"></div>

  <!-- TAB CONTENT -->
  <div id="bidSetupTab" class="tab-content active"></div>
  <div id="ganttTab" class="tab-content"></div>
  <div id="execSummaryTab" class="tab-content"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">Confirm</h2>
      <p class="modal-content" id="modalContent"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // SCOPE CONFIGURATION
    // ============================================

    const SCOPE_CONFIG = {
      'Repair':         { days: 5, hasSME: true,  criticalPath: false },
      'Field Services': { days: 5, hasSME: true,  criticalPath: false },
      'Fulfillment':    { days: 7, hasSME: true,  criticalPath: false },
      'Legal':          { days: 6, hasSME: false, criticalPath: false },
      'Finance':        { days: 4, hasSME: false, criticalPath: false },
      'Insurance':      { days: 4, hasSME: false, criticalPath: false },
      'Treasury':       { days: 5, hasSME: false, criticalPath: false },
      'Pricing':        { days: 4, hasSME: true,  criticalPath: false },
      'Logistics':      { days: 4, hasSME: false, criticalPath: false }
    };

    let currentGanttFilter = 'all';
    let currentActiveTab = 'bidSetup';

    // ============================================
    // WORKING DAY UTILITIES
    // ============================================

    function isWorkingDay(date) {
      const day = date.getDay();
      return day !== 0 && day !== 6; // Not Sunday or Saturday
    }

    function addWorkingDays(date, days) {
      const result = new Date(date);
      let count = 0;
      while (count < days) {
        result.setDate(result.getDate() + 1);
        if (isWorkingDay(result)) count++;
      }
      return result;
    }

    function subtractWorkingDays(date, days) {
      const result = new Date(date);
      let count = 0;
      while (count < days) {
        result.setDate(result.getDate() - 1);
        if (isWorkingDay(result)) count++;
      }
      return result;
    }

    function countWorkingDays(start, end) {
      let count = 0;
      const current = new Date(start);
      while (current <= end) {
        if (isWorkingDay(current)) count++;
        current.setDate(current.getDate() + 1);
      }
      return count;
    }

    function formatDate(date) {
      if (!date) return '';
      const d = new Date(date);
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const year = d.getFullYear();
      return `${month}/${day}/${year}`;
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      const [month, day, year] = dateStr.split('/');
      return new Date(year, month - 1, day);
    }

    // ============================================
    // STATE MANAGEMENT
    // ============================================

    let appState = {
      deals: [],
      activeDealId: null
    };

    function initializeState() {
      const saved = localStorage.getItem('gevITO_v2');
      if (saved) {
        try {
          appState = JSON.parse(saved);
        } catch (e) {
          appState = { deals: [], activeDealId: null };
        }
      }
      if (appState.deals.length === 0) {
        createNewDeal();
      }
      if (!appState.activeDealId) {
        appState.activeDealId = appState.deals[0].id;
      }
    }

    function saveState() {
      localStorage.setItem('gevITO_v2', JSON.stringify(appState));
    }

    function createNewDeal() {
      if (appState.deals.length >= 8) return;
      const id = 'deal_' + Date.now();
      const deal = {
        id,
        name: `Deal ${appState.deals.length + 1}`,
        opportunityName: '',
        opportunityType: 'Service',
        bidValue: 'Under $500K',
        cmName: '',
        smName: '',
        cslName: '',
        dealComplexity: 'Medium — 10 Working Days',
        dealPriority: 'Medium',
        customerDueDate: '',
        r1DueDate: '',
        selectedScopes: [],
        smeOverride: null,
        hasDeviations: 'No',
        l2l3Required: 'No',
        l6Required: 'No',
        cmuInvolvement: 'No',
        tasks: [],
        taskStatuses: {}
      };
      appState.deals.push(deal);
      appState.activeDealId = id;
      saveState();
    }

    function getActiveDeal() {
      return appState.deals.find(d => d.id === appState.activeDealId);
    }

    function updateActiveDeal(updates) {
      const deal = getActiveDeal();
      if (deal) {
        Object.assign(deal, updates);
        saveState();
      }
    }

    function deleteDeal(dealId) {
      appState.deals = appState.deals.filter(d => d.id !== dealId);
      if (appState.activeDealId === dealId) {
        appState.activeDealId = appState.deals[0]?.id || null;
      }
      if (appState.deals.length === 0) {
        createNewDeal();
      }
      saveState();
    }

    function renameDeal(dealId, newName) {
      const deal = appState.deals.find(d => d.id === dealId);
      if (deal) {
        deal.name = newName || `Deal ${appState.deals.indexOf(deal) + 1}`;
        saveState();
      }
    }

    // ============================================
    // TIMELINE CALCULATIONS
    // ============================================

    function calculateTimeline(deal) {
      const complexityMap = {
        'Low — 4 Working Days': 4,
        'Medium — 10 Working Days': 10,
        'High — 20 Working Days': 20
      };
      const baseHorizon = complexityMap[deal.dealComplexity] || 10;

      // Calculate auto SME count
      const autoSMECount = deal.selectedScopes.filter(s => SCOPE_CONFIG[s]?.hasSME).length;
      const smeCount = deal.smeOverride !== null ? deal.smeOverride : autoSMECount;

      // SME buffer
      let smeBuffer = 0;
      if (smeCount >= 6) smeBuffer = 4;
      else if (smeCount >= 2) smeBuffer = 3;

      // Critical scope days
      const criticalScopeDays = deal.selectedScopes.length > 0
        ? Math.max(...deal.selectedScopes.map(s => SCOPE_CONFIG[s]?.days || 0))
        : 0;

      // Approval time
      let approvalTime = 0;
      if (deal.l2l3Required === 'Yes') approvalTime += 3;
      if (deal.l6Required === 'Yes') approvalTime += 3;

      // Additional critical path
      const additionalCriticalPath = Math.max(0, criticalScopeDays - baseHorizon) + Math.max(0, approvalTime - baseHorizon);

      // Recommended timeline
      const recommendedTimeline = baseHorizon + smeBuffer + Math.max(0, additionalCriticalPath);

      return {
        baseHorizon,
        autoSMECount,
        smeCount,
        smeBuffer,
        criticalScopeDays,
        approvalTime,
        additionalCriticalPath,
        recommendedTimeline
      };
    }

    function calculateDates(deal) {
      if (!deal.customerDueDate) return {};

      const customerDue = new Date(deal.customerDueDate);
      const timeline = calculateTimeline(deal);
      const recommendedStartDate = subtractWorkingDays(customerDue, timeline.recommendedTimeline);
      const internalSubmissionTarget = subtractWorkingDays(customerDue, 2);
      const recommendedR1Date = addWorkingDays(recommendedStartDate, Math.round(timeline.recommendedTimeline * 0.4));

      return {
        recommendedStartDate,
        internalSubmissionTarget,
        recommendedR1Date,
        customerDue
      };
    }

    function calculateScheduleRisk(deal) {
      if (!deal.customerDueDate) return 'unknown';

      const today = new Date();
      const dates = calculateDates(deal);
      const timeline = calculateTimeline(deal);
      const available = countWorkingDays(today, dates.customerDue);

      if (available >= timeline.recommendedTimeline + 3) return 'green';
      if (available >= timeline.recommendedTimeline) return 'yellow';
      return 'red';
    }

    // ============================================
    // TASK GENERATION
    // ============================================

    function generateTasks(deal) {
      if (!deal.customerDueDate) return [];

      const dates = calculateDates(deal);
      const timeline = calculateTimeline(deal);
      const tasks = [];

      // Helper to create task
      function addTask(name, owner, daysFromStart, phase, isGate = false) {
        const dueDate = addWorkingDays(dates.recommendedStartDate, daysFromStart);
        tasks.push({
          id: 'task_' + Date.now() + Math.random(),
          name,
          owner,
          dueDate,
          phase,
          isGate,
          status: 'Not Started'
        });
      }

      // PHASE 1 — R0 to R1
      addTask('Opportunity Identified', 'CM', 0, 'Phase 1');
      addTask('R0 Review (CM & SM)', 'CM/SM', 1, 'Phase 1');
      addTask('Enter Opportunity into SFDC', 'CM', 2, 'Phase 1');
      addTask('Bid Document Review', 'CM', 2, 'Phase 1');
      addTask('Customer Clarifications', 'CM/SM', 3, 'Phase 1');
      addTask('Task Identification', 'CM', 3, 'Phase 1');

      // Selected scope reviews
      deal.selectedScopes.forEach((scope, idx) => {
        addTask(`${scope} Review`, 'CM/SME', 4 + idx, 'Phase 1');
      });

      if (deal.cmuInvolvement === 'Yes') {
        addTask('CMU Involvement Review', 'CM/CMU', 5 + deal.selectedScopes.length, 'Phase 1');
      }

      addTask('Submit R1 to Commercial Manager', 'CM', 6 + deal.selectedScopes.length, 'Phase 1');
      addTask('R1 SME Meeting', 'CM/SME', 7 + deal.selectedScopes.length, 'Phase 1');
      addTask('Enter R1 Meeting Minutes into SFDC', 'CM', 8 + deal.selectedScopes.length, 'Phase 1');
      addTask('R1 Decision Gate', 'CM', 9 + deal.selectedScopes.length, 'Phase 1', true);

      // PHASE 2 — R2 Approvals
      const phase2Start = 10 + deal.selectedScopes.length;
      addTask('Commercial Risk Analysis', 'CM', phase2Start, 'Phase 2');
      addTask('Commercial Financial & Pricing Review', 'Finance/CM', phase2Start + 1, 'Phase 2');
      addTask('SME Discussions & Recommendations', 'SME/CM', phase2Start + 2, 'Phase 2');
      addTask('SME Cost-Price & Scope Development', 'SME', phase2Start + 3, 'Phase 2');
      addTask('CPQ Quote Creation', 'CM/Pricing', phase2Start + 4, 'Phase 2');
      addTask('Risk Evaluation — CM Selects Risk Triggers', 'CM', phase2Start + 5, 'Phase 2');

      if (deal.hasDeviations === 'Yes') {
        addTask('Prepare Deal Summary', 'CM', phase2Start + 6, 'Phase 2');
        addTask('Submit Deviations in SFDC', 'CM', phase2Start + 7, 'Phase 2');
      }

      let approvalOffset = deal.hasDeviations === 'Yes' ? 8 : 6;

      if (deal.l2l3Required === 'Yes') {
        addTask('Schedule L2/L3 R2 Meeting', 'CM', phase2Start + approvalOffset, 'Phase 2');
        addTask('L2/L3 Approval', 'CM/L2/L3', phase2Start + approvalOffset + 1, 'Phase 2', true);
        approvalOffset += 2;
      }

      if (deal.l6Required === 'Yes') {
        addTask('Request L6 Approval', 'CM', phase2Start + approvalOffset, 'Phase 2');
        addTask('L6 Approval', 'CM/L6', phase2Start + approvalOffset + 1, 'Phase 2', true);
        approvalOffset += 2;
      }

      addTask('Submit Deal Summary to Approvers', 'CM', phase2Start + approvalOffset, 'Phase 2');
      addTask('Aero PS Review & Approval Call', 'CM/CSL', phase2Start + approvalOffset + 1, 'Phase 2');
      addTask('Record Approval & Meeting Minutes in SFDC', 'CM', phase2Start + approvalOffset + 2, 'Phase 2');
      addTask('Pricing Strategy Review', 'Pricing/CM', phase2Start + approvalOffset + 3, 'Phase 2');
      addTask('Bonds / Commercial Review', 'Finance/Legal', phase2Start + approvalOffset + 4, 'Phase 2');
      addTask('R2 Approval', 'CM/SM/CSL', phase2Start + approvalOffset + 5, 'Phase 2', true);

      // PHASE 3 — Offer Submission
      const phase3Start = phase2Start + approvalOffset + 6;
      addTask('Proposal Development', 'CM', phase3Start, 'Phase 3');
      addTask('Final Revision by CM, SM, CSL', 'CM/SM/CSL', phase3Start + 1, 'Phase 3');
      addTask('Proposal Release', 'CM', phase3Start + 2, 'Phase 3');
      addTask('Cost Sheet Completion', 'Finance/CM', phase3Start + 3, 'Phase 3');
      addTask('Proposal Approval Documentation', 'CM', phase3Start + 4, 'Phase 3');
      addTask('Review Meeting Minutes', 'CM', phase3Start + 5, 'Phase 3');
      addTask('SFDC Documentation Updates', 'CM', phase3Start + 6, 'Phase 3');
      addTask('Upload Final Proposal into SFDC', 'CM', phase3Start + 7, 'Phase 3');
      addTask('Submit R2 Offer in SFDC', 'CM', phase3Start + 8, 'Phase 3');
      addTask('Submit Proposal to Customer', 'CM/SM', phase3Start + 9, 'Phase 3');

      return tasks;
    }

    // ============================================
    // RENDER FUNCTIONS
    // ============================================

    function renderDealSwitcher() {
      const switcher = document.getElementById('dealSwitcher');
      switcher.innerHTML = '';

      appState.deals.forEach(deal => {
        const pill = document.createElement('div');
        pill.className = 'deal-pill' + (deal.id === appState.activeDealId ? ' active' : '');
        pill.innerHTML = `
          <span class="deal-pill-name" ondblclick="startRenameDeal(event, '${deal.id}')">${deal.name}</span>
          <button class="deal-pill-delete" onclick="confirmDeleteDeal('${deal.id}')">×</button>
        `;
        pill.addEventListener('click', (e) => {
          if (!e.target.classList.contains('deal-pill-delete')) {
            appState.activeDealId = deal.id;
            saveState();
            render();
          }
        });
        switcher.appendChild(pill);
      });

      if (appState.deals.length < 8) {
        const addPill = document.createElement('button');
        addPill.className = 'deal-pill deal-pill-add';
        addPill.textContent = '+ New Deal';
        addPill.onclick = () => {
          createNewDeal();
          render();
        };
        switcher.appendChild(addPill);
      }
    }

    function renderTabNav() {
      const tabNav = document.getElementById('tabNav');
      tabNav.innerHTML = `
        <button class="tab-btn ${currentActiveTab === 'bidSetup' ? 'active' : ''}" onclick="switchTab('bidSetup')">Bid Setup</button>
        <button class="tab-btn ${currentActiveTab === 'gantt' ? 'active' : ''}" onclick="switchTab('gantt')">Gantt Chart</button>
        <button class="tab-btn ${currentActiveTab === 'execSummary' ? 'active' : ''}" onclick="switchTab('execSummary')">Executive Summary</button>
      `;
    }

    function switchTab(tabName) {
      currentActiveTab = tabName;

      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (tabName === 'bidSetup') {
        document.getElementById('bidSetupTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else if (tabName === 'gantt') {
        document.getElementById('ganttTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        renderGanttTab();
      } else if (tabName === 'execSummary') {
        document.getElementById('execSummaryTab').classList.add('active');
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        renderExecSummaryTab();
      }
    }

    function renderBidSetupTab() {
      const deal = getActiveDeal();
      const container = document.getElementById('bidSetupTab');
      const timeline = calculateTimeline(deal);
      const dates = calculateDates(deal);

      // Calculate bid start alert
      let bidStartAlert = '';
      if (deal.customerDueDate) {
        const today = new Date();
        const recommendedStart = dates.recommendedStartDate;
        if (today > recommendedStart) {
          const daysLate = countWorkingDays(recommendedStart, today);
          const daysRemaining = countWorkingDays(today, dates.customerDue);
          bidStartAlert = `
            <div class="alert-badge red">
              <div class="alert-badge-icon">⚠</div>
              <div class="alert-badge-content">
                <div class="alert-badge-title">Start Immediately — Recommended Start Date Has Passed</div>
                <div class="alert-badge-detail">${daysLate} working days behind • ${daysRemaining} working days remaining</div>
              </div>
            </div>
          `;
        } else {
          const daysUntilStart = countWorkingDays(today, recommendedStart);
          bidStartAlert = `

    function renderGanttTab() {

      const today = new Date();

      // Calculate KPIs
      const totalTasks = deal.tasks.length;
      const completeTasks = deal.tasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const overdueTasks = deal.tasks.filter(t => {
        const dueDate = new Date(t.dueDate);
        return dueDate < today && deal.taskStatuses[t.id] !== 'Complete';
      });
      const atRiskTasks = deal.tasks.filter(t => {
        const dueDate = new Date(t.dueDate);
        const daysUntilDue = countWorkingDays(today, dueDate);
        return daysUntilDue <= 3 && daysUntilDue > 0 && deal.taskStatuses[t.id] !== 'Complete';
      });

      const daysToDeadline = dates.customerDue ? countWorkingDays(today, dates.customerDue) : 0;
      const percentComplete = totalTasks > 0 ? Math.round((completeTasks / totalTasks) * 100) : 0;

      // Overdue banner
      const overdueBannerHtml = `<div class="overdue-banner${overdueTasks.length === 0 ? ' hidden' : ''}" id="overdueBanner"><div class="overdue-banner-icon">⚠</div><div>${overdueTasks.length > 0 ? overdueTasks.length + ' overdue task(s): ' + overdueTasks.map(t => t.name).join(', ') : ''}</div></div>`;

         if (phaseTasks.length > 0) {

             const rowClass = `${isOverdue ? 'overdue' : ''} ${status === 'Complete' ? 'complete' : ''} ${task.isGate ? 'gate' : ''}`;
             tableHtml += `
               <tr class="${rowClass}" data-task-id="${task.id}" data-phase="${task.phase}" data-gate="${task.isGate ? 'true' : 'false'}" data-overdue="${isOverdue ? 'true' : 'false'}">

          <div class="kpi-grid-2row" style="grid-template-columns: repeat(3, 1fr);">
            <div class="kpi-card">
              <div class="kpi-label">Days to Deadline</div>
              <div class="kpi-value">${daysToDeadline}</div>
              <div class="kpi-detail">Working days remaining</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">% Complete</div>
              <div class="kpi-value">${percentComplete}%</div>
              <div class="kpi-detail">${completeTasks} / ${totalTasks} tasks</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Approval & Deviation Status</div>
              <div class="kpi-value" style="font-size:14px; line-height:1.8;">
                <div>Pending: <strong>${approvalsNeeded}</strong></div>
                <div style="color:${approvalsOverdue > 0 ? '#ef4444' : '#22c55e'}">Overdue: <strong>${approvalsOverdue}</strong></div>
                <div>Deviations: <strong>${deviationsOpen}</strong></div>
              </div>
              <div class="kpi-detail">Approvals &amp; open deviations</div>
            </div>
          </div>

          <!-- Deal Details Card -->
          <div class="card">
            <h3 class="card-title">Deal Details</h3>
            <div class="card-content">
              <div class="detail-row">
                <span class="detail-label">Opportunity Name</span>
                <span class="detail-value">${deal.opportunityName || '—'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Opportunity Type</span>
                <span class="detail-value">${deal.opportunityType}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Bid Value</span>
                <span class="detail-value">${deal.bidValue}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">CM / SM / CSL</span>
                <span class="detail-value">${deal.cmName || '—'} / ${deal.smName || '—'} / ${deal.cslName || '—'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Complexity</span>
                <span class="detail-value">${deal.dealComplexity}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Priority</span>
                <span class="detail-value" style="color: ${deal.dealPriority === 'High' ? '#ef4444' : deal.dealPriority === 'Medium' ? '#f59e0b' : '#22c55e'};">
                  ${deal.dealPriority === 'High' ? '🔴 HIGH PRIORITY' : deal.dealPriority}
                </span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Selected Scopes</span>
                <span class="detail-value">
                  ${deal.selectedScopes.length > 0 ? deal.selectedScopes.map(s => `<span class="pill-tag">${s}</span>`).join('') : '—'}
                </span>
              </div>
              <div class="detail-row">
                <span class="detail-label">SME Count</span>
                <span class="detail-value">${timeline.smeCount} (${deal.smeOverride !== null ? 'override' : 'auto'})</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Recommended Start Date</span>
                <span class="detail-value">${formatDate(dates.recommendedStartDate)}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">R1 Status</span>
                <span class="detail-value">${deal.r1DueDate ? formatDate(new Date(deal.r1DueDate)) : 'Not entered'}</span>
              </div>
               <div class="detail-row">
                 <span class="detail-label">L2/L3 Required</span>
                 <span class="detail-value">${deal.l2l3Required}</span>
               </div>
               <div class="detail-row">
                 <span class="detail-label">L6 Required</span>
                 <span class="detail-value">${deal.l6Required}</span>
               </div>
               <div class="detail-row">
                 <span class="detail-label">CMU Involvement</span>
                 <span class="detail-value">${deal.cmuInvolvement}</span>
               </div>
            </div>
          </div>

          <!-- Phase Progress -->
          <div class="card">
            <h3 class="card-title">Phase Progress</h3>
            <div class="card-content">
              <div>
                <div class="progress-label">Phase 1 — R0 to R1 (${phase1Complete} / ${phase1Tasks.length})</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${phase1Percent}%;">${phase1Percent}%</div>
                </div>
              </div>
              <div>
                <div class="progress-label">Phase 2 — R2 Approvals (${phase2Complete} / ${phase2Tasks.length})</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${phase2Percent}%;">${phase2Percent}%</div>
                </div>
              </div>
              <div>
                <div class="progress-label">Phase 3 — Offer Submission (${phase3Complete} / ${phase3Tasks.length})</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${phase3Percent}%;">${phase3Percent}%</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Key Milestones -->
          <div class="card">
            <h3 class="card-title">Key Milestones</h3>
            <table class="table-simple">
              <thead>
                <tr>
                  <th>Milestone</th>
                  <th>Target Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Customer Due Date</td>
                  <td>${formatDate(dates.customerDue)}</td>
                  <td>${daysToDeadline > 0 ? '✓ On Track' : '✗ Overdue'}</td>
                </tr>
                <tr>
                  <td>Internal Submission Target</td>
                  <td>${formatDate(dates.internalSubmissionTarget)}</td>
                  <td>${countWorkingDays(today, dates.internalSubmissionTarget) > 0 ? '✓ On Track' : '✗ Overdue'}</td>
                </tr>
                <tr>
                  <td>R1 Due Date</td>
                  <td>${deal.r1DueDate ? formatDate(new Date(deal.r1DueDate)) : formatDate(dates.recommendedR1Date)}</td>
                  <td>—</td>
                </tr>
                <tr>
                  <td>R2 Approval Gate</td>
                  <td>—</td>
                  <td>—</td>
                </tr>
                <tr>
                  <td>Proposal Submission</td>
                  <td>${formatDate(dates.customerDue)}</td>
                  <td>—</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Approval Gate Status -->
          <div class="card">
            <h3 class="card-title">Approval Gate Status</h3>
            <table class="table-simple">
              <thead>
                <tr>
                  <th>Gate</th>
                  <th>Required</th>
                  <th>Status</th>
                  <th>Owner</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>R1 Decision Gate</td>
                  <td>Yes</td>
                  <td>Pending</td>
                  <td>CM</td>
                </tr>
                ${deal.l2l3Required === 'Yes' ? `<tr><td>L2/L3 Approval</td><td>Yes</td><td>Pending</td><td>CM/L2/L3</td></tr>` : ''}
                ${deal.l6Required === 'Yes' ? `<tr><td>L6 Approval</td><td>Yes</td><td>Pending</td><td>CM/L6</td></tr>` : ''}
                <tr>
                  <td>R2 Final Approval</td>
                  <td>Yes</td>
                  <td>Pending</td>
                  <td>CM/SM/CSL</td>
                </tr>
              </tbody>
            </table>
          </div>




          <!-- Print Button -->
          <button class="btn btn-primary btn-full-width" onclick="window.print()" style="font-size: 16px; padding: 14px;">
            🖨 Print / Export PDF
          </button>
        </div>
      `;

    }

    function render() {
      renderDealSwitcher();
      renderTabNav();

      // Always re-render bid setup (it drives the other tabs)
      renderBidSetupTab();

      // Only re-render Gantt and Exec Summary if they are currently active
      // to avoid wiping in-place DOM updates
      if (currentActiveTab === 'gantt') {
        renderGanttTab();
      } else if (currentActiveTab === 'execSummary') {
        renderExecSummaryTab();
      }

      // Restore correct tab visibility
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      if (currentActiveTab === 'bidSetup') {
        document.getElementById('bidSetupTab').classList.add('active');
      } else if (currentActiveTab === 'gantt') {
        document.getElementById('ganttTab').classList.add('active');
      } else if (currentActiveTab === 'execSummary') {
        document.getElementById('execSummaryTab').classList.add('active');
      }
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================

    function updateDeal(updates) {
      updateActiveDeal(updates);
      // If on Gantt or Exec tab, only re-render bid setup + tab nav to preserve in-place Gantt state
      if (currentActiveTab === 'gantt' || currentActiveTab === 'execSummary') {
        renderDealSwitcher();
        renderTabNav();
        renderBidSetupTab();
        // Re-render active tab to reflect changes
        if (currentActiveTab === 'gantt') renderGanttTab();
        else renderExecSummaryTab();
        // Restore visibility
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(currentActiveTab === 'gantt' ? 'ganttTab' : 'execSummaryTab').classList.add('active');
      } else {
        render();
      }
    }

    function updateScope(scope, checked) {
      const deal = getActiveDeal();
      if (checked) {
        if (!deal.selectedScopes.includes(scope)) {
          deal.selectedScopes.push(scope);
        }
      } else {
        deal.selectedScopes = deal.selectedScopes.filter(s => s !== scope);
      }
      saveState();
      render();
    }

    function updateSMEOverride(value) {
      const deal = getActiveDeal();
      deal.smeOverride = value ? parseInt(value) : null;
      saveState();
      render();
    }

    function toggleSection(section) {
      section.classList.toggle('collapsed');
    }

    function generateTimeline() {
      const deal = getActiveDeal();

      if (!deal.customerDueDate) {
        alert('Please enter a Customer Due Date before generating the timeline.');
        return;
      }

      deal.tasks = generateTasks(deal);
      deal.taskStatuses = {};
      deal.tasks.forEach(t => {
        deal.taskStatuses[t.id] = 'Not Started';
      });
      saveState();

      // Switch to Gantt tab and render it directly
      currentActiveTab = 'gantt';

      // Update tab nav active state without full re-render
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[1].classList.add('active');

      // Update tab content visibility
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById('ganttTab').classList.add('active');

      // Render the Gantt tab now that tasks exist
      renderGanttTab();
    }

    function updateTaskStatus(taskId, newStatus) {
      // 1. Persist the status change
      const deal = getActiveDeal();
      deal.taskStatuses[taskId] = newStatus;
      saveState();

      // 2. Update the row in-place — find the row by data-task-id
      const row = document.querySelector(`tr[data-task-id="${taskId}"]`);
      if (!row) return;

      const today = new Date();
      const task = deal.tasks.find(t => t.id === taskId);
      if (!task) return;
      const dueDate = new Date(task.dueDate);
      const isOverdue = dueDate < today && newStatus !== 'Complete';
      const isComplete = newStatus === 'Complete';

      // 3. Update row classes in-place
      row.classList.toggle('complete', isComplete);
      row.classList.toggle('overdue', isOverdue);
      row.dataset.overdue = isOverdue ? 'true' : 'false';

      // 4. Sync the status dropdown to the new value (avoid change-event loop)
      const sel = row.querySelector('.task-status-select');
      if (sel && sel.value !== newStatus) sel.value = newStatus;

      // 5. Update Mark Complete button disabled state
      const btn = row.querySelector('.task-action-btn');
      if (btn) btn.disabled = isComplete;

      // 6. Recalculate and update the 4 KPI cards in-place
      const allTasks = deal.tasks;
      const totalTasks = allTasks.length;
      const completeTasks = allTasks.filter(t => deal.taskStatuses[t.id] === 'Complete').length;
      const percentComplete = totalTasks > 0 ? Math.round((completeTasks / totalTasks) * 100) : 0;
      const overdueTasks = allTasks.filter(t => {
        const d = new Date(t.dueDate);
        return d < today && deal.taskStatuses[t.id] !== 'Complete';
      });
      const atRiskTasks = allTasks.filter(t => {
        const d = new Date(t.dueDate);
        const wd = countWorkingDays(today, d);
        return wd <= 3 && wd > 0 && deal.taskStatuses[t.id] !== 'Complete';
      });

      // Update KPI card values — select by position in .kpi-bar
      const kpiCards = document.querySelectorAll('.kpi-bar .kpi-card');
      if (kpiCards[1]) kpiCards[1].querySelector('.kpi-value').textContent = `${completeTasks} / ${totalTasks}`;
      if (kpiCards[1]) kpiCards[1].querySelector('.kpi-detail').textContent = `${percentComplete}% progress`;
      if (kpiCards[2]) {
        kpiCards[2].querySelector('.kpi-value').textContent = overdueTasks.length;
        kpiCards[2].querySelector('.kpi-value').style.color = overdueTasks.length > 0 ? '#ef4444' : '#22c55e';
      }
      if (kpiCards[3]) {
        kpiCards[3].querySelector('.kpi-value').textContent = atRiskTasks.length;
        kpiCards[3].querySelector('.kpi-value').style.color = atRiskTasks.length > 0 ? '#f59e0b' : '#22c55e';
      }

      // 7. Update overdue banner in-place
      const banner = document.querySelector('.overdue-banner');
      if (banner) {
        if (overdueTasks.length > 0) {
          banner.classList.remove('hidden');
          const divs = banner.querySelectorAll('div');
          if (divs[1]) divs[1].textContent = overdueTasks.length + ' overdue task(s): ' + overdueTasks.map(t => t.name).join(', ');
        } else {
          banner.classList.add('hidden');
        }
      }
    }

    function filterGantt(filter, btn) {
      currentGanttFilter = filter;

      // Update active pill state
      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.classList.remove('active');
        const pillText = pill.textContent.trim().toLowerCase();
        if (
          (filter === 'all' && pillText === 'all') ||
          (filter === 'phase1' && pillText === 'phase 1') ||
          (filter === 'phase2' && pillText === 'phase 2') ||
          (filter === 'phase3' && pillText === 'phase 3') ||
          (filter === 'gates' && pillText === 'gates only') ||
          (filter === 'overdue' && pillText === 'overdue')
        ) {
          pill.classList.add('active');
        }
      });

      const rows = document.querySelectorAll('#ganttTableBody tr');

      rows.forEach(row => {
        let shouldShow = false;

        if (filter === 'all') {
          shouldShow = true;
        } else if (filter === 'phase1') {
          shouldShow = row.dataset.phase === 'Phase 1' || row.dataset.phaseHeader === 'Phase 1';
        } else if (filter === 'phase2') {
          shouldShow = row.dataset.phase === 'Phase 2' || row.dataset.phaseHeader === 'Phase 2';
        } else if (filter === 'phase3') {
          shouldShow = row.dataset.phase === 'Phase 3' || row.dataset.phaseHeader === 'Phase 3';
        } else if (filter === 'gates') {
          shouldShow = row.dataset.gate === 'true' || !!row.dataset.phaseHeader;
        } else if (filter === 'overdue') {
          shouldShow = row.dataset.overdue === 'true' || !!row.dataset.phaseHeader;
        }

        row.style.display = shouldShow ? '' : 'none';
      });
    }

    function updateDelaySimulator() {
      const deal = getActiveDeal();
      const dates = calculateDates(deal);
      const timeline = calculateTimeline(deal);
      const today = new Date();

      const delayDays = parseInt(document.getElementById('delayDaysSlider')?.value || 1);
      document.getElementById('delayDaysValue').textContent = delayDays;

      const newSubmissionTarget = addWorkingDays(dates.internalSubmissionTarget, delayDays);
      const newAvailable = countWorkingDays(today, dates.customerDue) - delayDays;
      const newRisk = newAvailable >= timeline.recommendedTimeline + 3 ? 'green' : newAvailable >= timeline.recommendedTimeline ? 'yellow' : 'red';

      document.getElementById('delayNewSubmission').textContent = formatDate(newSubmissionTarget);
      document.getElementById('delayCompression').textContent = `${delayDays} working days`;
      document.getElementById('delayRiskStatus').textContent = newRisk === 'green' ? '✓ Green' : newRisk === 'yellow' ? '⚠ Yellow' : '✗ Red';
    }

    function startRenameDeal(event, dealId) {
      event.stopPropagation();
      const deal = appState.deals.find(d => d.id === dealId);
      const nameSpan = event.target;
      const currentName = deal.name;
      nameSpan.contentEditable = true;
      nameSpan.focus();
      nameSpan.onblur = () => {
        nameSpan.contentEditable = false;
        const newName = nameSpan.textContent.trim();
        if (newName) {
          renameDeal(dealId, newName);
        } else {
          nameSpan.textContent = currentName;
        }
        render();
      };
      nameSpan.onkeydown = (e) => {
        if (e.key === 'Enter') {
          nameSpan.blur();
        }
      };
    }

    function confirmDeleteDeal(dealId) {
      showModal(
        'Delete Deal',
        'Are you sure you want to delete this deal? This action cannot be undone.',
        () => {
          deleteDeal(dealId);
          render();
          closeModal();
        }
      );
    }

    function confirmReset() {
      showModal(
        'Reset All Deals',
        'Are you sure you want to reset all deals? This will clear all data and cannot be undone.',
        () => {
          localStorage.removeItem('gevITO_v2');
          appState = { deals: [], activeDealId: null };
          initializeState();
          render();
          closeModal();
        }
      );
    }

    function showModal(title, content, onConfirm) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').textContent = content;
      document.getElementById('modalConfirmBtn').onclick = onConfirm;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // ============================================
    // INITIALIZATION
    // ============================================

    initializeState();
    render();
  </script>
</body>
</html>
